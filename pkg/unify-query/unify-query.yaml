consul:
  check_ttl: 30s
  consul_address: http://127.0.0.1:8500
  service_name: bkmonitorv3
  kv_base_path: bkmonitorv3/unify-query
redis:
  mode: standalone
  host: 127.0.0.1
  port: 6379
  password:
  master_name:
  sentinel_address:
    - 127.0.0.1:6379
  sentinel_password:
  database: 0
  dial_timeout: 1s
  read_timeout: 10s
  service_name: bkmonitorv3:spaces
  kv_base_path: bkmonitorv3:unify-query
victoria_metrics:
  timeout: 30s
influxdb:
  ping:
    count: 3
    period: 20s
    timeout: 5s
  target_address: http://127.0.0.1:8086
  content_type: application/json
  timeout: 1m
  query_raw:
    type: http
    uri_path: api/v1/raw/read
    accept: application/x-protobuf
    accept_encoding: snappy
  max_limit: 1e8
  max_slimit: 1e5
  tolerance: 5
es:
  max_concurrency: 200
  alias_refresh_period: 1m
http:
  multiTenantMode: false
  address: 127.0.0.1
  path:
    es: /query/es
    promql: /query/promql
    ts: /query/ts
  password: ""
  port: 10205
  profile:
    enable: false
    path: /debug/pprof/
  prometheus:
    enable: true
    path: /metrics
  read_timeout: 3s
  username: ""
  write_timeout: 30s
  query:
    max_routing: 10
    content_type: application/x-protobuf
    content_encoding: snappy
    raw:
      es_batch:
        max_members: 16
        max_body_bytes: 1048576
        max_concurrent_searches: 4
query:
  down_sampled:
    enable: true
    bucket:
    - 2_bkapm_metric_test1
logger:
  level: info
trace:
  dataid: 0
  service_name: "unify-query"
  # always 记录所有请求；parent_based 时带 traceparent 的请求按其 sampled 标志决定是否记录
  sampler: always
  otlp:
    host: 127.0.0.1
    port: 4317
    token:
    type: grpc
bbolt:
  default_path: bolt.db
metadata:
  druid_query:
    raw_suffix: "_raw"
    cmdb_suffix: "_cmdb"
bk_api:
  address: http://127.0.0.1:12001
  code: bk_code
  secret: bk_secret
bk_data:
  address: "" # 可选 如果配置了 address，则直接使用此地址，不再通过 bk_api.address + uri_path 组装
  uri_path: bk_data
  authentication_method: token
  token: 123456
  cluster_space_uid:
    test:
    - bkcc__test

# Trace profile 直连存储读取（T6.1）。未配置时保持 fail closed：带 Trace 信封的
# /query/ts/raw 请求返回固定拒绝，绝不回落到老的 BKBase/ES 链路。
# 生产读目标来自 Kingeye Metadata 的逐租户发布物；每条路由必须含正整数 app_id，
# 只接受租户共享 cw_trace_span 或该应用独占 cw_trace_span_app_<app_id>。
# bk_biz_id 保留用于身份/IAM/行过滤，不按业务拼表；AppID=0 与旧业务物理表均拒绝。
# 查询必须含单应用 app_id 等值条件和 AND 连接，缺应用路由不回退；上线需重发完整应用快照。
# 来源跟随 storage.source：consul 时使用下方 data_path/version_path；redis 时
# 从 redis.kv_base_path 派生逐租户 String key 与通知 channel，不使用这两条 Consul 路径。
# Redis 模式在配置 trace_profile 时启用发布物加载；两种模式均要求只读连接配置先就绪。
trace_profile:
  # read_target_data_path: kingeye_<platform>_<environment>/metadata/unify-query/data/trace/read_target
  # read_target_version_path: kingeye_<platform>_<environment>/metadata/unify-query/version/trace/read_target
  # 若使用本地受信静态路由，必须明确登记 app_id 和物理库表，不能同时配置发布源路由。
  # read_routes:
  # - bk_tenant_id: default
  #   bk_biz_id: 132
  #   app_id: 7
  #   # 可选来源元数据必须成对提供；不用于选择物理库表，不接受客户端传入。
  #   result_table_id: default.apm_trace_span
  #   data_id: 901
  #   profile: trace_span
  #   database: default_kapm
  #   table: cw_trace_span  # 应用独占目标则为 cw_trace_span_app_7
  #   cluster_id: "18"
  #   schema_version: sha256:0bf5aac6160a636e
  # 单请求预算上限；缺省为 max_body_bytes=65536、max_limit=10000、max_offset=100000、max_range_days=30。
  # max_body_bytes: 65536
  # max_limit: 10000
  # max_offset: 100000
  # max_range_days: 30
  # 允许调用直连读取的已验证 bk_app_code。全局 jwt.enabled 可以保持 false，
  # 但必须配置 jwt.public_key 与该 app_code 的 jwt.bk_app_code_spaces；typed 请求
  # 仍要求签名有效、app.verified=true 且空间授权成功。
  # allowed_bk_app_codes:
  # - kingeye-apm
  # 只读连接凭据仅留在 UQ；cluster_id 必须覆盖发布路由引用的全部集群。
  # readonly_connections:
  # - cluster_id: "18"
  #   host: 127.0.0.1
  #   port: 9030
  #   username: read_only
  #   password: ""
  #   max_open_conns: 8
  #   connect_timeout: 3s
  #   query_timeout: 30s
  #   max_rows: 10000

storage:
  source: consul  # consul or redis，默认为 consul；同时选择 Trace 读目标来源
