type: "platform"

processor:
  - name: "token_checker/aes256"
    config:
      type: "aes256"
      version: ""
      resource_key: "bk.data.token"
      salt: "bk"
      decoded_key: "5c0243de-ef38-4f52-a901-79ed9808e4b5"
      decoded_iv: "bkbkbkbkbkbkbkbk"
      must_empty_token: true
      fixed_token: ""
      traces_dataid: 0
      metrics_dataid: 0
      logs_dataid: 0
      profiles_dataid: 0
      bk_biz_id: 0
      bk_app_name: ""


  - name: "resource_filter/common"
    config:
      assemble:
        - destination: "bk.instance.id" # 转换后名称
          separator: ":"
          keys:
            - "resource.telemetry.sdk.language"
            - "resource.service.name"
            - "resource.net.host.name"
            - "resource.net.host.ip"
            - "resource.net.host.port"
      drop:
        keys:
          - "resource.bk.data.token"
